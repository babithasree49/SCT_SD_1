<!-- Task 01: SCT_SD_1.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="SCT_SD_1.css">
</head>
<body>
  <!-- Main layout container -->
  <main class="container">
    <!-- Centered application card -->
    <div class="card">
      <div class="card-accent-bar"></div>
      
      <header class="card-header">
        <h1>Temperature Converter</h1>
        <p class="subtitle">Convert temperatures between Celsius, Fahrenheit and Kelvin</p>
      </header>

      <!-- Converter form controls -->
      <div class="converter-form">
        <!-- Temperature Value Input -->
        <div class="form-group">
          <label for="temp-input">Enter Temperature</label>
          <input 
            type="number" 
            id="temp-input" 
            placeholder="Enter temperature" 
            step="any"
            autocomplete="off"
          >
          
          <!-- Quick Preset Chips -->
          <div class="preset-chips">
            <button type="button" class="chip" data-temp="0" data-unit="Celsius">0°C</button>
            <button type="button" class="chip" data-temp="20" data-unit="Celsius">20°C</button>
            <button type="button" class="chip" data-temp="37" data-unit="Celsius">37°C</button>
            <button type="button" class="chip" data-temp="100" data-unit="Celsius">100°C</button>
          </div>
        </div>

        <!-- Unit Selection Dropdowns -->
        <div class="unit-group">
          <div class="form-group">
            <label for="from-unit">From</label>
            <select id="from-unit">
              <option value="Celsius" selected>Celsius</option>
              <option value="Fahrenheit">Fahrenheit</option>
              <option value="Kelvin">Kelvin</option>
            </select>
          </div>

          <!-- Swap Units Button -->
          <div class="swap-wrapper">
            <button type="button" id="swap-btn" class="btn-swap" title="Swap units" aria-label="Swap units">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"/>
              </svg>
            </button>
          </div>

          <div class="form-group">
            <label for="to-unit">To</label>
            <select id="to-unit">
              <option value="Celsius">Celsius</option>
              <option value="Fahrenheit" selected>Fahrenheit</option>
              <option value="Kelvin">Kelvin</option>
            </select>
          </div>
        </div>

        <!-- Convert Action Button -->
        <button type="button" id="convert-btn" class="btn btn-primary">Convert</button>

        <!-- Result / Error Display Container -->
        <div id="result-container" class="result-container" aria-live="polite"></div>

        <!-- Clear Action Button -->
        <button type="button" id="clear-btn" class="btn btn-secondary">Clear</button>
      </div>
    </div>
  </main>

  <script src="SCT_SD_1.js"></script>
</body>
</html>
